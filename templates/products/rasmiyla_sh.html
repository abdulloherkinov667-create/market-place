<!doctype html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uzum Checkout - Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --uzum: #7f4df2;
            --payme: #00c1af;
            --click: #008ae4;
            --card-bg: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f4f5f7 0%, #e2e4e9 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .phone {
            width: 360px; height: 740px; background: #000; border-radius: 45px;
            padding: 10px; border: 4px solid #333; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInPhone 0.8s ease-out;
        }

        @keyframes fadeInPhone {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            width: 100%; height: 100%; background: #fff; border-radius: 35px;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }

        .top-bar {
            padding: 25px 20px 15px; display: flex; align-items: center; gap: 15px;
            background: #fff; border-bottom: 1px solid #f0f0f0;
        }
        .back-btn {
            width: 38px; height: 38px; background: #f5f5f5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #000; transition: 0.3s;
        }
        .back-btn:hover { background: #eee; }

        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #1f2026; }

        .input-box { margin-bottom: 15px; }
        .input-box label { display: block; font-size: 12px; color: #8b8e99; margin-bottom: 5px; margin-left: 5px; }
        .input-box input, .input-box textarea {
            width: 100%; padding: 12px 15px; border-radius: 12px;
            border: 1.5px solid #eee; background: #f9f9f9; outline: none;
            transition: 0.3s; font-size: 14px;
        }
        .input-box input:focus { border-color: var(--uzum); background: #fff; }

        .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .pay-card {
            border: 1.5px solid #eee; border-radius: 12px; padding: 12px;
            cursor: pointer; transition: 0.3s; position: relative;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #444;
        }
        .pay-card i { font-size: 20px; }
        .pay-card span { font-size: 11px; font-weight: 600; }

        /* Active States */
        .pay-card[data-type="uzum"].active { border-color: var(--uzum); background: #f7f3ff; color: var(--uzum); }
        .pay-card[data-type="payme"].active { border-color: var(--payme); background: #f0fffb; color: var(--payme); }
        .pay-card[data-type="click"].active { border-color: var(--click); background: #f0f7ff; color: var(--click); }
        .pay-card[data-type="cash"].active { border-color: #1f2026; background: #f4f4f4; color: #1f2026; }

        .footer { padding: 15px 20px 30px; border-top: 1px solid #eee; background: #fff; }
        .order-btn {
            width: 100%; background: var(--uzum); color: #fff; border: none;
            padding: 16px; border-radius: 14px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px -5px rgba(127, 77, 242, 0.4);
        }
        .order-btn:active { transform: scale(0.98); }

        .notch {
            width: 150px; height: 30px; background: #000; position: absolute;
            top: 0; left: 50%; transform: translateX(-50%); border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px; z-index: 10;
        }
    </style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">
        <div class="top-bar">
            <a href="{% url 'Shoping_Cart_Html' %}" class="back-btn">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <span class="section-title" style="margin-bottom: 0">Rasmiylashtirish</span>
        </div>

        <div class="content">
            <form action="{% url 'upgdate_rasmiylash' order.id %}" method="POST" id="orderForm">
                {% csrf_token %}

                <input type="hidden" name="payment_method" id="payment_method_input" value="cash">

                <div class="section-title">Yetkazib berish</div>
                
                <div class="input-box">
                    <label>Telefon raqam</label>
                    <input type="text" name="phone_number" id="phone" value="+998 " placeholder="+998 90 123 45 67" required>
                </div>

                <div class="input-box">
                    <label>Manzil</label>
                    <textarea name="address" rows="2" placeholder="Shahar, Ko'cha, Uy raqami" required></textarea>
                </div>

                <div class="section-title">To'lov usuli</div>
                
                <div class="payment-grid">
                    <div class="pay-card active" data-type="cash" onclick="selectPay('cash')">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <span>Naqd pul</span>
                    </div>
                    <div class="pay-card" data-type="uzum" onclick="selectPay('uzum')">
                        <i class="fa-solid fa-building-columns"></i>
                        <span>Uzum Bank</span>
                    </div>
                    <div class="pay-card" data-type="payme" onclick="selectPay('payme')">
                        <i class="fa-solid fa-wallet"></i>
                        <span>Payme</span>
                    </div>
                    <div class="pay-card" data-type="click" onclick="selectPay('click')">
                        <i class="fa-solid fa-mouse-pointer"></i>
                        <span>Click</span>
                    </div>
                </div>

                <div class="input-box" style="margin-top: 20px;">
                    <label>Izoh</label>
                    <input type="text" name="notes" placeholder="Kurer uchun eslatma...">
                </div>
            </form>
        </div>

        <div class="footer">
            <button type="submit" form="orderForm" class="order-btn">
                Tasdiqlash
            </button>
        </div>
    </div>
</div>

<script>
    // To'lov usulini tanlash funksiyasi
    function selectPay(type) {
        // Hamma kartalardan 'active' klassini olib tashlash
        document.querySelectorAll('.pay-card').forEach(card => {
            card.classList.remove('active');
        });
        
        // Tanlangan kartaga 'active' klassini qo'shish
        const selectedId = document.querySelector(`.pay-card[data-type="${type}"]`);
        if (selectedId) {
            selectedId.classList.add('active');
        }

        // Backendga ketadigan yashirin input qiymatini o'zgartirish
        document.getElementById("payment_method_input").value = type;
    }

    // Telefon raqami uchun maska
    const phoneInput = document.getElementById("phone");
    phoneInput.addEventListener("input", function (e) {
        let value = phoneInput.value.replace(/\D/g, "");

        if (!value.startsWith("998")) {
            value = "998" + value;
        }

        // Faqat 12 ta raqamgacha ruxsat (998 + 9 ta raqam)
        value = value.substring(0, 12);

        let formatted = "+";
        if (value.length > 0) formatted += value.substring(0, 3);
        if (value.length > 3) formatted += " " + value.substring(3, 5);
        if (value.length > 5) formatted += " " + value.substring(5, 8);
        if (value.length > 8) formatted += " " + value.substring(8, 10);
        if (value.length > 10) formatted += " " + value.substring(10, 12);

        phoneInput.value = formatted;
    });
</script>

</body>
</html>
