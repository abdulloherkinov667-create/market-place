{% extends 'base.html' %}

{% block main %}
<div class="katalog-scroll-area">
    
    <div class="mood-explorer">
        <p class="section-title">Bugun kayfiyatingiz qanday? ✨</p>
        <div class="mood-grid">
            <div class="mood-item float-1" onclick="highlightCategory('electronics')">
                <span class="mood-emoji">⚡</span>
                <span class="mood-name">Faol</span>
            </div>
            <div class="mood-item float-2" onclick="highlightCategory('fashion')">
                <span class="mood-emoji">🕶️</span>
                <span class="mood-name">Zamonaviy</span>
            </div>
            <div class="mood-item float-3" onclick="highlightCategory('home')">
                <span class="mood-emoji">🏠</span>
                <span class="mood-name">Shinam</span>
            </div>
            <div class="mood-item float-1" onclick="highlightCategory('beauty')">
                <span class="mood-emoji">✨</span>
                <span class="mood-name">Go'zal</span>
            </div>
        </div>
    </div>

    <div class="magic-banner">
        <div class="magic-circle"></div>
        <div class="magic-content">
            <div class="magic-text">
                <h5>Kun omadli kelsin!</h5>
                <p>Katalogimizdan eng sara mahsulotlar</p>
            </div>
            <div class="magic-icon">
                <i class="fa-solid fa-wand-sparkles star-sparkle"></i>
            </div>
        </div>
    </div>

    <div class="katalog-grid-custom">
        {% for category in categories %}
        <a href="{% url 'category_products' category.slug %}" class="modern-card-v4" id="cat-{{ category.id }}">
            <div class="card-inner">
                <span class="category-label">{{ category.name }}</span>
                <div class="image-holder">
                    {% if category.image %}
                        <img src="{{ category.image.url }}" alt="{{ category.name }}">
                    {% endif %}
                </div>
                <div class="arrow-circle">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>

</div>

<style>
    /* KONTEYNER */
    .katalog-scroll-area {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        background: #fff;
        scrollbar-width: none;
    }

    .section-title {
        font-size: 14px;
        font-weight: 700;
        color: #333;
        margin-bottom: 15px;
    }

    /* 1. MOOD EXPLORER (O'ynab turuvchi tugmalar) */
    .mood-grid {
        display: flex;
        justify-content: space-between;
        margin-bottom: 25px;
    }
    .mood-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
    }
    .mood-emoji {
        width: 50px;
        height: 50px;
        background: #f0f0f5;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: 0.3s;
    }
    .mood-name { font-size: 10px; font-weight: 600; color: #777; }

    /* Floating Animatsiyalari */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .float-1 { animation: float 3s infinite ease-in-out; }
    .float-2 { animation: float 3.5s infinite ease-in-out; }
    .float-3 { animation: float 2.5s infinite ease-in-out; }

    .mood-item:active .mood-emoji {
        transform: scale(0.9);
        background: #7f4df2;
        color: white;
    }

    /* 2. MAGIC BANNER */
    .magic-banner {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        border-radius: 20px;
        padding: 20px;
        position: relative;
        overflow: hidden;
        margin-bottom: 25px;
        color: white;
    }
    .magic-circle {
        position: absolute;
        top: -20px; right: -20px;
        width: 80px; height: 80px;
        background: rgba(127, 77, 242, 0.4);
        filter: blur(30px);
    }
    .magic-text h5 { font-size: 16px; margin-bottom: 5px; }
    .magic-text p { font-size: 11px; opacity: 0.7; }
    
    .star-sparkle {
        position: absolute;
        right: 20px; top: 30%;
        font-size: 30px;
        color: #ffd700;
        animation: rotateSparkle 4s infinite linear;
    }
    @keyframes rotateSparkle {
        from { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.2); }
        to { transform: rotate(360deg) scale(1); }
    }

    /* 3. MODERN GRID (2 ta qatorda) */
    .katalog-grid-custom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    .modern-card-v4 {
        height: 140px;
        background: #f8f9fd;
        border-radius: 24px;
        text-decoration: none;
        position: relative;
        overflow: hidden;
        transition: 0.3s;
        border: 1px solid #f0f0f5;
    }
    .modern-card-v4:active { transform: scale(0.95); }

    .card-inner {
        padding: 15px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .category-label {
        font-size: 14px;
        font-weight: 800;
        color: #1f2026;
        line-height: 1.2;
    }
    .image-holder {
        align-self: flex-end;
        width: 70px;
        height: 70px;
    }
    .image-holder img {
        width: 100%; height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
    }
    .arrow-circle {
        position: absolute;
        bottom: 12px; left: 15px;
        width: 25px; height: 25px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #7f4df2;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
</style>

<script>
    // Kayfiyatni bosganda chiroyli effekt
    function highlightCategory(type) {
        // Bu funksiyaga o'zingiz istagan JS mantiqni qo'shishingiz mumkin
        // Masalan, mos kategoriyani tebratish
        const cards = document.querySelectorAll('.modern-card-v4');
        const randomCard = cards[Math.floor(Math.random() * cards.length)];
        
        randomCard.style.transform = "scale(1.05)";
        randomCard.style.borderColor = "#7f4df2";
        
        setTimeout(() => {
            randomCard.style.transform = "scale(1)";
            randomCard.style.borderColor = "#f0f0f5";
        }, 500);
    }
</script>
{% endblock main %}
