{% extends 'base.html' %} {% block main %}
<style>
  .cart-container {
    padding: 15px;
    background: #f4f5f7;
    min-height: 100%;
    padding-bottom: 120px;
    position: relative;
  }

  .cart-header h2 {
    font-size: 20px;
    color: #1f2026;
    margin-bottom: 15px;
  }

  /* Mahsulot kartasi */
  .cart-item {
    background: #fff;
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
    transition: opacity 0.3s;
  }

  .cart-item-img {
    width: 85px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    background: #f8f8f8;
  }

  .cart-item-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cart-item-title {
    font-size: 13px;
    color: #1f2026;
    line-height: 1.4;
  }
  .cart-item-price {
    font-weight: 700;
    font-size: 15px;
    color: #1f2026;
    margin: 5px 0;
  }

  /* Controls */
  .item-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .quantity-group {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #f1f1f2;
    padding: 5px 12px;
    border-radius: 10px;
  }
  .qty-btn {
    border: none;
    background: none;
    font-size: 20px;
    cursor: pointer;
  }
  .qty-num {
    font-size: 14px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }
  .remove-icon-btn {
    color: #8b8e99;
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
  }

  /* Portlash zarralari (Particles) stili */
  .particle {
    position: absolute;
    pointer-events: none;
    border-radius: 2px;
    z-index: 1000;
  }

  /* Checkout Footer */
  .checkout-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #fff;
    padding: 15px 20px 25px;
    border-top: 1px solid #eee;
    z-index: 20;
  }
  .summary-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .total-price {
    font-size: 18px;
    font-weight: 700;
    color: #7f4df2;
  }
  .order-btn {
    width: 100%;
    background: #7f4df2;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 16px;
  }
</style>

<div class="main-content">
  <div class="cart-container" id="cartContainer">
    <div class="cart-header"><h2>Savat</h2></div>

    <div class="cart-items-list">
      <div class="cart-item" data-price="120000">
        <img
          src="https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=200"
          class="cart-item-img"
        />
        <div class="cart-item-info">
          <div>
            <p class="cart-item-title">Mars Geymer klaviaturasi</p>
            <p class="cart-item-price">
              <span class="item-total-price">120 000</span> so'm
            </p>
          </div>
          <div class="item-controls-row">
            <div class="quantity-group">
              <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
              <span class="qty-num">1</span>
              <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
            <i
              class="fa-regular fa-trash-can remove-icon-btn"
              onclick="disintegrateItem(this)"
            ></i>
          </div>
        </div>
      </div>

      <div class="cart-item" data-price="350000">
        <img
          src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200"
          class="cart-item-img"
        />
        <div class="cart-item-info">
          <div>
            <p class="cart-item-title">Smart Watch Series 8</p>
            <p class="cart-item-price">
              <span class="item-total-price">350 000</span> so'm
            </p>
          </div>
          <div class="item-controls-row">
            <div class="quantity-group">
              <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
              <span class="qty-num">1</span>
              <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
            <i
              class="fa-regular fa-trash-can remove-icon-btn"
              onclick="disintegrateItem(this)"
            ></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="checkout-footer">
  <div class="summary-line">
    <span>Jami:</span>
    <span class="total-price" id="grand-total">470 000 so'm</span>
  </div>
  <button class="order-btn">Rasmiylashtirish</button>
</div>

<script>
  function formatMoney(n) {
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function updateQty(btn, change) {
    const item = btn.closest(".cart-item");
    const qtyNum = item.querySelector(".qty-num");
    const priceDisp = item.querySelector(".item-total-price");
    let qty = parseInt(qtyNum.innerText) + change;
    if (qty < 1) return;
    qtyNum.innerText = qty;
    priceDisp.innerText = formatMoney(qty * parseInt(item.dataset.price));
    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;
    document.querySelectorAll(".cart-item").forEach((item) => {
      total +=
        parseInt(item.querySelector(".qty-num").innerText) *
        parseInt(item.dataset.price);
    });
    document.getElementById("grand-total").innerText =
      formatMoney(total) + " so'm";
  }

  // MAYDALANIB KETISH ANIMATSIYASI
  function disintegrateItem(btn) {
    const item = btn.closest(".cart-item");
    const rect = item.getBoundingClientRect();
    const container = document.getElementById("cartContainer");

    // Elementning rangini aniqlash (asosan oq va binafsha)
    const colors = ["#7f4df2", "#ffffff", "#f1f1f2", "#1f2026"];

    // 30 ta mayda zarracha yaratish
    for (let i = 0; i < 40; i++) {
      const p = document.createElement("div");
      p.className = "particle";

      // Tasodifiy o'lcham va rang
      const size = Math.random() * 6 + 2;
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.background = colors[Math.floor(Math.random() * colors.length)];

      // Boshlang'ich pozitsiya (trash icon atrofida)
      const iconRect = btn.getBoundingClientRect();
      p.style.left = iconRect.left - rect.left + 15 + "px";
      p.style.top = iconRect.top - rect.top + 15 + "px";

      item.appendChild(p);

      // Harakat animatsiyasi
      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 100 + 50;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;

      p.animate(
        [
          { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
          {
            transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg)`,
            opacity: 0,
          },
        ],
        {
          duration: 600 + Math.random() * 400,
          easing: "cubic-bezier(0, .9, .57, 1)",
          fill: "forwards",
        },
      );
    }

    // Asosiy elementni yo'qotish
    item.style.transition = "all 0.5s ease";
    item.style.transform = "scale(0.8) translateY(10px)";
    item.style.opacity = "0";
    item.style.filter = "blur(5px)";

    setTimeout(() => {
      item.remove();
      calculateTotal();
    }, 500);
  }
</script>
{% endblock main %}
