{% load humanize %}

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Hisobotlar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    /* ASOSIY KONTEYNER */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .phone {
      width: 360px; height: 720px; background: #1a1a1a; border-radius: 40px;
      padding: 10px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      position: relative; border: 4px solid #333;
    }

    .screen {
      width: 100%; height: 100%; background: #f8f9fa; border-radius: 32px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }

    .notch {
      width: 60px; height: 18px; background: #1a1a1a; position: absolute; top: 0; left: 50%;
      transform: translateX(-50%); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; z-index: 110;
    }

    /* ANIMATSIYALAR */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fillProgress {
      from { width: 0; }
      to { width: var(--final-width); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* HEADER */
    .header {
      padding: 45px 15px 15px; background: #fff; border-bottom: 1px solid #eee;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 17px; font-weight: 700; color: #1a1a1a; }

    /* HISOBOT KARTALARI */
    .content { flex: 1; overflow-y: auto; padding: 15px 15px 100px; }
    
    .report-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    
    .report-card {
      background: #fff; padding: 15px; border-radius: 20px; border: 1px solid #eee;
      text-align: center;
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0; /* Boshida ko'rinmaydi */
    }

    /* Har bir karta kechikish bilan chiqadi */
    .report-card:nth-child(1) { animation-delay: 0.1s; }
    .report-card:nth-child(2) { animation-delay: 0.2s; }
    .report-card:nth-child(3) { animation-delay: 0.3s; }
    .report-card:nth-child(4) { animation-delay: 0.4s; }

    .report-card i { font-size: 20px; margin-bottom: 8px; display: block; }
    .report-card strong { font-size: 15px; color: #333; margin-top: 4px; display: block; }

    /* ANALITIKA BLOKI */
    .chart-container {
      background: #fff; border-radius: 24px; padding: 20px; margin-bottom: 15px;
      border: 1px solid #eee;
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: 0.5s;
      opacity: 0;
    }

    /* PROGRESS BARS */
    .progress-item { margin-bottom: 15px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-bottom: 5px; }
    .progress-bar { width: 100%; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    
    .progress-fill { 
      height: 100%; border-radius: 4px; 
      animation: fillProgress 1.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards;
      animation-delay: 0.8s;
      width: 0; /* Animatsiyadan oldin */
    }

    /* MAQSAD BLOKI (Oylik maqsad) */
    .target-card {
      background: #6366f1; color: #fff; border-radius: 24px; padding: 20px;
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: 0.7s;
      opacity: 0;
    }

    /* NAVBAR */
    .navbar { position: absolute; bottom: 0; width: 100%; height: 75px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; padding-bottom: 10px; }
    .nav-item { text-decoration: none; color: #a0a0a0; text-align: center; font-size: 10px; font-weight: 600; transition: 0.3s; }
    .nav-item.active { color: #6366f1; transform: translateY(-5px); }
    .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }

    /* FEEDBACK EFFECT */
    .report-card:active { transform: scale(0.95); transition: 0.1s; }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      
      <header class="header">
        <div class="header-title">Hisobotlar</div>
        <i class="fa-solid fa-filter" style="color: #6366f1; cursor: pointer;"></i>
      </header>

      <div class="content">
        <div class="report-grid">
          <div class="report-card">
            <i class="fa-solid fa-sack-dollar" style="color: #10b981;"></i>
            <span>Sof foyda</span>
            <strong style="color: #10b981;">+12.4 mln</strong>
          </div>
          <div class="report-card">
            <i class="fa-solid fa-box-open" style="color: #f59e0b;"></i>
            <span>Sotuvlar</span>
            <strong>154 ta</strong>
          </div>
          <div class="report-card">
            <i class="fa-solid fa-user-plus" style="color: #6366f1;"></i>
            <span>Yangi mijoz</span>
            <strong>42 ta</strong>
          </div>
          <div class="report-card">
            <i class="fa-solid fa-arrow-trend-down" style="color: #ef4444;"></i>
            <span>Voz kechilgan</span>
            <strong style="color: #ef4444;">8 ta</strong>
          </div>
        </div>

        <div class="chart-container">
         
          
          <div class="progress-item">
            <div class="progress-label"><span>Elektronika</span> <span>65%</span></div>
            <div class="progress-bar">
              <div class="progress-fill" style="--final-width: 65%; background: #6366f1;"></div>
            </div>
          </div>

          <div class="progress-item">
            <div class="progress-label"><span>Aksessuarlar</span> <span>25%</span></div>
            <div class="progress-bar">
              <div class="progress-fill" style="--final-width: 25%; background: #10b981;"></div>
            </div>
          </div>

          <div class="progress-item">
            <div class="progress-label"><span>Xizmatlar</span> <span>10%</span></div>
            <div class="progress-bar">
              <div class="progress-fill" style="--final-width: 10%; background: #f59e0b;"></div>
            </div>
          </div>
        </div>

        <div class="target-card">
          <h3 style="color: #fff; font-size: 14px; margin-bottom: 10px;">Oylik maqsad</h3>
          <p style="font-size: 11px; opacity: 0.8; margin-bottom: 15px;">Siz oylik rejaning 80% qismini bajardingiz!</p>
          <div class="progress-bar" style="background: rgba(255,255,255,0.2);">
            <div class="progress-fill" style="--final-width: 80%; background: #fff;"></div>
          </div>
        </div>
      </div>

      <nav class="navbar">
        <a href="{% url 'buyurtma_admin' %}" class="nav-item"><i class="fa-solid fa-cart-flatbed-suitcase"></i><span>Buyurtma</span></a>
        <a href="{% url 'mijozlar' %}" class="nav-item"><i class="fa-solid fa-users-gear"></i><span>Mijozlar</span></a>
        <a href="{% url 'kassa' %}" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Kassa</span></a>
        <a href="{% url 'hisobothtml' %}" class="nav-item active"><i class="fa-solid fa-chart-pie"></i><span>Hisobot</span></a>
      </nav>

    </div>
  </div>

</body>
</html>
