<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karta qo'shish - Mobile UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* PHONE FRAME (Siz yuborgan shablon) */
    .phone {
      width: 360px;
      height: 720px;
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      border: 4px solid #333;
    }

    .notch {
      width: 60px; height: 20px; background: #000;
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
      z-index: 110;
    }

    /* SCREEN */
    .screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 28px;
      overflow-y: auto; /* Ichki qism skroll bo'lishi uchun */
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .page-header {
      padding: 35px 20px 15px;
      display: flex;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
    }

    .back-btn {
      color: #1f2026;
      font-size: 18px;
      margin-right: 15px;
      text-decoration: none;
      cursor: pointer;
    }

    /* KARTA SHABLONI (Interaktiv) */
    .card-preview-container {
        padding: 20px;
    }

    .card-preview {
        width: 100%;
        height: 170px;
        background: linear-gradient(135deg, #1d1d1d 0%, #434343 100%);
        border-radius: 16px;
        padding: 20px;
        color: white;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.4s;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .card-chip {
        width: 40px;
        height: 30px;
        background: linear-gradient(135deg, #f0d078 0%, #cf9e3d 100%);
        border-radius: 6px;
    }

    .card-type-label {
        position: absolute;
        top: 20px;
        right: 20px;
        font-weight: bold;
        font-style: italic;
    }

    .preview-number {
        font-size: 18px;
        letter-spacing: 2px;
        font-family: 'Courier New', monospace;
        margin-top: 15px;
    }

    .preview-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .preview-label { font-size: 9px; text-transform: uppercase; opacity: 0.7; }
    .preview-text { font-size: 12px; font-weight: 500; }

    /* FORMA */
    .form-container {
        padding: 0 20px 20px;
    }

    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 12px; color: #8b8e99; margin-bottom: 5px; }
    
    .form-input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2e5ec;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    .form-input:focus { border-color: #6366f1; }

    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .submit-btn {
        background: #6366f1;
        color: white;
        border: none;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        opacity: 0.5;
        pointer-events: none;
        transition: 0.3s;
    }

    .submit-btn.active {
        opacity: 1;
        pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    
    <div class="screen">
      <div class="page-header">
        <div class="back-btn" onclick="window.history.back()">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h2 style="font-size: 17px; margin: 0;">Yangi karta qo'shish</h2>
      </div>

      <div class="card-preview-container">
          <div class="card-preview" id="cardBg">
              <div class="card-type-label" id="cardType">BANK</div>
              <div class="card-chip"></div>
              <div class="preview-number" id="displayNum">•••• •••• •••• ••••</div>
              <div class="preview-bottom">
                  <div>
                      <div class="preview-label">Karta egasi</div>
                      <div class="preview-text" id="displayName">ISM FAMILYA</div>
                  </div>
                  <div style="text-align: right;">
                      <div class="preview-label">Muddati</div>
                      <div class="preview-text" id="displayExp">00/00</div>
                  </div>
              </div>
          </div>
      </div>

      <div class="form-container">
          <form id="cardForm">
              <div class="form-group">
                  <label class="form-label">Karta raqami</label>
                  <input type="text" class="form-input" id="inNum" placeholder="0000 0000 0000 0000" maxlength="19">
              </div>

              <div class="form-group">
                  <label class="form-label">Karta egasi (Lotincha)</label>
                  <input type="text" class="form-input" id="inName" placeholder="ALI VALIYEV" style="text-transform: uppercase;">
              </div>

              <div class="form-row">
                  <div class="form-group">
                      <label class="form-label">Muddat</label>
                      <input type="text" class="form-input" id="inExp" placeholder="MM/YY" maxlength="5">
                  </div>
                  <div class="form-group">
                      <label class="form-label">CVV</label>
                      <input type="password" class="form-input" id="inCvv" placeholder="***" maxlength="3">
                  </div>
              </div>

              <button type="submit" class="submit-btn" id="subBtn">Kartani yaratish</button>
          </form>
      </div>

    </div>
  </div>

  <script>
    const inNum = document.getElementById('inNum');
    const inName = document.getElementById('inName');
    const inExp = document.getElementById('inExp');
    const inCvv = document.getElementById('inCvv');
    const subBtn = document.getElementById('subBtn');

    const displayNum = document.getElementById('displayNum');
    const displayName = document.getElementById('displayName');
    const displayExp = document.getElementById('displayExp');
    const cardBg = document.getElementById('cardBg');
    const cardType = document.getElementById('cardType');

    function checkFields() {
        if(inNum.value.length === 19 && inName.value.trim().length > 3 && inExp.value.length === 5 && inCvv.value.length === 3) {
            subBtn.classList.add('active');
        } else {
            subBtn.classList.remove('active');
        }
    }

    inNum.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        // Uzcard/Humo ranglari
        if (val.startsWith('8600')) {
            cardBg.style.background = 'linear-gradient(135deg, #0052cc 0%, #002d72 100%)';
            cardType.innerText = 'Uzcard';
        } else if (val.startsWith('9860')) {
            cardBg.style.background = 'linear-gradient(135deg, #00a859 0%, #006b38 100%)';
            cardType.innerText = 'Humo';
        } else {
            cardBg.style.background = 'linear-gradient(135deg, #1d1d1d 0%, #434343 100%)';
            cardType.innerText = 'BANK';
        }
        let formatted = val.replace(/(.{4})/g, '$1 ').trim();
        e.target.value = formatted;
        displayNum.innerText = formatted || "•••• •••• •••• ••••";
        checkFields();
    });

    inName.addEventListener('input', (e) => {
        displayName.innerText = e.target.value.toUpperCase() || "ISM FAMILYA";
        checkFields();
    });

    inExp.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.length >= 2) {
            e.target.value = val.substring(0, 2) + '/' + val.substring(2, 4);
        }
        displayExp.innerText = e.target.value || "00/00";
        checkFields();
    });

    inCvv.addEventListener('input', checkFields);
  </script>

</body>
</html>
