<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manzilni Saqlash</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Umumiy stillar */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    /* Telefon konteyneri */
    .phone {
      width: 360px; height: 720px; background: #000; border-radius: 40px;
      padding: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      position: relative; border: 4px solid #333;
    }

    .screen {
      width: 100%; height: 100%; background: #ffffff;
      border-radius: 28px; overflow: hidden; display: flex; flex-direction: column;
    }

    .notch {
      width: 60px; height: 18px; background: #000; position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10;
    }

    /* Header */
    .header {
      padding: 45px 20px 15px; background: #fff; display: flex;
      align-items: center; gap: 15px; border-bottom: 1px solid #f0f0f0;
    }
    .back-link { color: #333; text-decoration: none; font-size: 20px; }
    .header h2 { font-size: 18px; color: #1a1a1a; font-weight: 700; }

    /* Form stili */
    .content { flex: 1; padding: 20px; overflow-y: auto; background: #fdfdfd; }
    
    .form-box { display: flex; flex-direction: column; gap: 18px; }

    .field-wrapper { display: flex; flex-direction: column; gap: 6px; }

    .field-wrapper label {
      font-size: 13px; font-weight: 600; color: #555; margin-left: 4px;
    }

    /* Input va Textarea */
    .form-control {
      width: 100%; padding: 14px 16px; border: 1.5px solid #eee;
      border-radius: 12px; font-size: 14px; outline: none;
      background: #f9f9f9; transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #6366f1; background: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
    }

    textarea.form-control { resize: none; min-height: 90px; }

    /* Tugma */
    .submit-btn {
      width: 100%; padding: 16px; background: #6366f1;
      color: white; border: none; border-radius: 14px;
      font-weight: 700; font-size: 16px; cursor: pointer;
      margin-top: 10px; transition: 0.2s;
    }

    .submit-btn:hover { background: #4f46e5; }
    .submit-btn:active { transform: scale(0.98); }

    .footer-note {
      font-size: 12px; color: #a0a0a0; text-align: center;
      margin-top: 20px; line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    
    <div class="screen">
      <div class="header">
        <a href="{% url 'home_page' %}" class="back-link">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Yangi manzil</h2>
      </div>

      <div class="content">
        <form method="POST" class="form-box">
          {% csrf_token %}

          <div class="field-wrapper">
            <label>Mo'ljal (Qayerga yaqin?)</label>
            <input type="text" 
                   name="landmark" 
                   class="form-control" 
                   placeholder="Masalan: Korzinka yonida" 
                   maxlength="255" 
                   required>
          </div>

          <div class="field-wrapper">
            <label>To'liq manzil</label>
            <input type="text" 
                   name="full_address" 
                   class="form-control" 
                   placeholder="Ko'cha nomi, uy va xonadon raqami" 
                   maxlength="500" 
                   required>
          </div>

          <div class="field-wrapper">
            <label>Qo'shimcha izoh</label>
            <textarea name="extra_info" 
                      class="form-control" 
                      placeholder="Kurer uchun eslatma (masalan: dom kodi, pod'ezd)" 
                      maxlength="255"></textarea>
          </div>

          <button type="submit" class="submit-btn">Manzilni saqlash</button>
        </form>
        <p class="footer-note">
          Kiritilgan ma'lumotlar kurerga buyurtmani <br> 
          to'g'ri yetkazib berishga yordam beradi.
        </p>
      </div>
    </div>
  </div>

</body>
</html>
