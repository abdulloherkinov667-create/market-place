<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil - Uzum Style</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    /* ASOSIY USLUBLAR (home (3).html fayli bilan bir xil) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone {
      width: 360px;
      height: 720px;
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      border: 4px solid #333;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR - Sizning faylingizdagi dek (25px padding) */
    .top-bar {
      padding: 25px 15px 15px; 
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      z-index: 10;
    }

    .filter-btn {
      width: 45px;
      height: 45px;
      background: #fff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #1a1a1a;
      font-size: 18px;
      transition: all 0.2s ease;
      border: 1px solid #f0f0f0;
    }

    .filter-btn.active-style {
      background: #6366f1;
      color: #fff;
    }

    .search-box {
      flex: 1;
      background: #f1f1f2;
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      border: none;
      background: none;
      outline: none;
      width: 100%;
    }

    /* SIDEBAR - Sizning faylingizdagi dek */
    .sidebar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 80%;
      height: 100%;
      background: #fff;
      z-index: 100;
      transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 60px 20px;
      border-top-right-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 10px 0 30px rgba(0,0,0,0.1);
    }

    .sidebar.active { left: 0; }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 90;
    }

    .overlay.active { display: block; }

    .side-item {
      padding: 15px;
      margin-bottom: 5px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      color: #333;
    }

    /* PROFIL QISMI */
    .main-content {
      flex: 1;
      overflow-y: auto;
      background: #f8f9fa;
    }

    .profile-header {
      background: #fff;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;
    }

    .avatar-wrapper img {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid #6366f1;
      object-fit: cover;
    }

    .edit-icon {
      position: absolute; bottom: 5px; right: 5px;
      background: #6366f1; color: #fff;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; border: 2px solid #fff;
    }

    .settings-list { background: #fff; margin-top: 10px; }

    .settings-item {
      display: flex; align-items: center; padding: 18px 20px;
      border-bottom: 1px solid #f8f8f8; cursor: pointer;
    }

    .settings-item i:first-child { width: 35px; color: #6366f1; font-size: 18px; }
    .settings-item span { flex: 1; font-size: 15px; color: #1f2026; }
    .settings-item .chevron { color: #ccc; font-size: 12px; }

    /* BOTTOM NAV - Sizning faylingizdagi dek */
    .bottom-nav {
      height: 75px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
    }

    .nav-item {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8e8e93;
      flex: 1;
    }
    .nav-item.active { color: #6366f1; }
    .nav-item i { font-size: 22px; margin-bottom: 4px; }
    .nav-item span { font-size: 10px; }

    .notch {
      width: 60px; height: 20px; background: #000;
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
      z-index: 110;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    
    <div class="screen">
      <div class="overlay" id="overlay"></div>
      <div class="sidebar" id="sidebar">
        <h2 style="margin-bottom: 30px; padding-left: 15px;">Menyu</h2>
        <div class="side-item"><i class="fa-solid fa-circle-user"></i> Shaxsiy kabinet</div>
        <div class="side-item"><i class="fa-solid fa-box"></i> Buyurtmalarim</div>
        <div class="side-item"><i class="fa-solid fa-heart"></i> Saralanganlar</div>
        <div class="side-item"><i class="fa-solid fa-headset"></i> Qo'llab-quvvatlash</div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <div class="side-item" style="color: red;"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</div>
      </div>

      <div class="top-bar">
        <div class="filter-btn" id="filterBtn" onclick="toggleSidebar()">
          <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass" style="color: #999;"></i>
          <input type="text" placeholder="Qidirish...">
        </div>
      </div>
      
      <div class="main-content">
        <div class="profile-header">
          <div class="avatar-wrapper">
            <img src="https://ui-avatars.com/api/?name=Sherzod+A&background=6366f1&color=fff" alt="User">
            <div class="edit-icon"><i class="fa-solid fa-camera"></i></div>
          </div>
          <h2 style="font-size: 20px;">{{ request.user }}</h2>
          <p style="color: #8b8e99; font-size: 14px;">sherzod@example.com</p>
        </div>

        <div class="settings-list">
          <div class="settings-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>Shaxsiy ma'lumotlar</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-item">
            <i class="fa-solid fa-location-dot"></i>
            <span>Yetkazib berish manzillari</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-item">
            <i class="fa-solid fa-credit-card"></i>
            <span>To'lov usullari</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-item">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Xavfsizlik</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
        </div>
      </div>

      <nav class="bottom-nav">
        <a href="{% url 'home_page' %}" class="nav-item active"><i class="fa-solid fa-house"></i><span>Asosiy</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Katalog</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Savat</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-heart"></i><span>Istaklar</span></a>
        <a href="{% url 'profile' %}" class="nav-item"><i class="fa-regular fa-user"></i><span>Profil</span></a>
      </nav>

    </div>
  </div>

  <script>
    // Sidebar funksiyasi (home (3).html bilan bir xil)
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const filterBtn = document.getElementById('filterBtn');

      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
      filterBtn.classList.toggle('active-style');
    }
    document.getElementById('overlay').onclick = toggleSidebar;
  </script>

</body>
</html>
