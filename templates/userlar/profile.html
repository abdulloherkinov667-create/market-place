{% extends 'base.html' %}

{% block main %}
<style>
    /* PROFIL QISMI STILLARI */
    .main-content {
      flex: 1;
      overflow-y: auto;
      background: #f8f9fa;
      scrollbar-width: none;
    }
    
    .main-content::-webkit-scrollbar {
      display: none;
    }

    .profile-header {
      background: #fff;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;
    }

    .avatar-wrapper img {
      width: 100%; 
      height: 100%;
      border-radius: 50%;
      border: 3px solid #7f4df2;
      object-fit: cover;
    }

    .edit-icon {
      position: absolute; 
      bottom: 5px; 
      right: 5px;
      background: #7f4df2; 
      color: #fff;
      width: 28px; 
      height: 28px; 
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 12px; 
      border: 2px solid #fff;
      cursor: pointer;
    }

    .settings-list { 
      background: #fff; 
      margin-top: 10px; 
    }

    /* Barcha menyu elementlari uchun umumiy stil */
    .settings-item {
      display: flex; 
      align-items: center; 
      padding: 18px 20px;
      border-bottom: 1px solid #f8f8f8; 
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none !important;
    }

    .settings-item:hover, .settings-item:active {
      background: #f1f1f2;
    }

    .settings-item i:first-child { 
      width: 35px; 
      color: #7f4df2; 
      font-size: 18px; 
    }

    .settings-item span { 
      flex: 1; 
      font-size: 15px; 
      color: #1f2026; 
      font-weight: 400;
    }

    .settings-item .chevron { 
      color: #ccc; 
      font-size: 12px; 
    }

    .logout-item i:first-child {
        color: #ff4d4d;
    }
</style>

<div class="main-content">
    <div class="profile-header">
        <div class="avatar-wrapper">
            <img src="https://ui-avatars.com/api/?name={{ request.user }}&background=7f4df2&color=fff" alt="User">
            <div class="edit-icon"><i class="fa-solid fa-camera"></i></div>
        </div>
        <h2 style="font-size: 20px; margin: 0;">{{ request.user.username|default:"Mehmon" }}</h2>
        <p style="color: #8b8e99; font-size: 14px; margin: 5px 0 0;">{{ request.user.email|default:"user@example.com" |capfirst }}</p>
    </div>

    <div class="settings-list">
        <a href="{% url 'shaxsiy_malumotlar_user' %}" class="settings-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>Shaxsiy ma'lumotlar</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>

        <a href="{% url 'home_page' %}" class="settings-item">
            <i class="fa-solid fa-house-user"></i>
            <span>Asosiy</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>

        <a href="{% url 'yetkazib_berish_manzili' %}" class="settings-item">
            <i class="fa-solid fa-location-dot"></i>
            <span>Yetkazib berish manzillari</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>

        <a href="{% url 'tolov_usullari' %}" class="settings-item">
            <i class="fa-solid fa-credit-card"></i>
            <span>To'lov usullari</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>

        <a href="{% url 'xavsizlik' %}" class="settings-item">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Xavfsizlik</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>
        
        <a href="{% url 'logout_html' %}" class="settings-item logout-item">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span style="color: #ff4d4d;">Tizimdan chiqish</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>
    </div>
</div>
{% endblock main %}
