<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #e5e5e5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    /* TELEFON SHABLONI */
    .phone {
      width: 360px; height: 720px; background: #000; border-radius: 40px;
      padding: 12px; position: relative; border: 4px solid #333;
    }
    .notch {
      width: 60px; height: 20px; background: #000; position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10;
    }
    .screen {
      width: 100%; height: 100%; background: #f8f9fa; border-radius: 28px;
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* HEADER */
    .page-header {
      background: #fff; padding: 35px 20px 15px;
      display: flex; align-items: center; border-bottom: 1px solid #f0f0f0;
    }
    .back-btn { font-size: 18px; color: #1f2026; margin-right: 15px; cursor: pointer; }

    /* KARTA LISTI */
    .card-list { padding: 15px; }
    .card-carousel { position: relative; min-height: 220px; }
    .carousel-item { position: absolute; inset: 0; opacity: 0; transform: scale(0.96); transition: opacity .35s ease, transform .35s ease; pointer-events: none; }
    .carousel-item.active { opacity: 1; transform: scale(1); pointer-events: auto; position: relative; }
    .carousel-controls { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
    .carousel-btn {
      width: 48%; border: none; background: #fff; color: #7f4df2;
      border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 700;
      cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,.08);
    }

    /* IXCHAM VA CHO'ZILGAN KARTA */
    .bank-card {
      width: 100%;
      height: 165px; /* Ozg'in dizayn */
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border-radius: 15px;
      padding: 18px 22px;
      color: #fff;
      position: relative;
      margin-bottom: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .card-chip {
      width: 36px; height: 26px;
      background: linear-gradient(135deg, #f0d078 0%, #cf9e3d 100%);
      border-radius: 4px; margin-bottom: 10px;
    }

    .card-type-logo {
      position: absolute; top: 20px; right: 22px;
      font-weight: 700; font-size: 11px; letter-spacing: 1px;
    }

    .card-number {
      font-size: 16px; 
      letter-spacing: 2.5px;
      font-family: 'Courier New', monospace;
      margin: 10px 0;
      display: block;
      opacity: 0.95;
    }

    .card-footer {
      display: flex; 
      justify-content: space-between;
      align-items: flex-end; 
      margin-top: 10px;
    }

    .footer-left { display: flex; flex-direction: column; }
    .footer-right { display: flex; gap: 20px; text-align: right; }

    .card-label { font-size: 8px; text-transform: uppercase; opacity: 0.7; margin-bottom: 2px; }
    .card-value { font-size: 11px; font-weight: 500; letter-spacing: 0.5px; }

    .delete-card {
      position: absolute; bottom: 18px; right: 22px;
      width: 28px; height: 28px; background: rgba(255,255,255,0.1);
      border-radius: 6px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; cursor: pointer;
      transition: 0.2s;
    }
    .delete-card:hover { background: rgba(255, 50, 50, 0.4); }

    /* TUGMA */
    .add-card-btn {
      background: #fff; border: 1.5px dashed #7f4df2;
      border-radius: 12px; padding: 15px;
      display: flex; align-items: center; justify-content: center;
      color: #7f4df2; font-size: 14px; font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="page-header">
        <i href="{% url 'tolov_usullari' %}" class="fa-solid fa-arrow-left back-btn" onclick="history.back()"></i>
        <h2 style="font-size: 16px; margin: 0;">To'lov usullari</h2>
      </div>

      <div class="card-list">
        {% if banks_carts %}
          <div class="card-carousel" id="cardCarousel">
            {% for card in banks_carts %}
              <div class="bank-card carousel-item{% if forloop.first %} active{% endif %}">
                <div class="card-type-logo">UZCARD</div>
                <div class="card-chip"></div>

                <span class="card-number">{{ card.masked_number }}</span>

                <div class="card-footer">
                  <div class="footer-left">
                    <span class="card-label">Karta egasi</span>
                    <span class="card-value">{{ card.cart_egasi }}</span>
                  </div>

                  <div class="footer-right" style="margin-right: 40px;"> <div>
                      <span class="card-label">Muddat</span>
                      <span class="card-value">{{ card.muddat }}</span>
                    </div>
                    <div>
                      <span class="card-label">CVV</span>
                      <span class="card-value">***</span>
                    </div>
                  </div>
                </div>

                <a href="{% url 'delete_card' card.id %}" class="delete-card" onclick="return confirm('Karta o\'chirilsinmi?');">
                  <i class="fa-solid fa-trash-can"></i>
                </a>
              </div>
            {% endfor %}
          </div>

          <div class="carousel-controls">
            <button type="button" class="carousel-btn" id="prevCard"><i class="fa-solid fa-chevron-left"></i> Orqaga</button>
            <button type="button" class="carousel-btn" id="nextCard">Oldinga <i class="fa-solid fa-chevron-right"></i></button>
          </div>
        {% else %}
          <div style="padding: 20px; color: #444; background: #fff; border-radius: 14px; text-align: center; margin-bottom: 15px;">
            Hozircha karta qo'shilmagan. Quyidagi tugma orqali yangi karta qo'shing.
          </div>
        {% endif %}

        <a href="{% url 'yangi_karta' %}" class="add-card-btn">
          <i class="fa-solid fa-plus" style="margin-right: 8px;"></i>
          Yangi karta qo'shish
        </a>
      </div>

      <script>
        const carouselItems = document.querySelectorAll('.carousel-item');
        let currentIndex = 0;

        function showCard(index) {
          carouselItems.forEach((item, i) => {
            item.classList.toggle('active', i === index);
          });
        }

        document.getElementById('prevCard')?.addEventListener('click', () => {
          if (!carouselItems.length) return;
          currentIndex = (currentIndex - 1 + carouselItems.length) % carouselItems.length;
          showCard(currentIndex);
        });

        document.getElementById('nextCard')?.addEventListener('click', () => {
          if (!carouselItems.length) return;
          currentIndex = (currentIndex + 1) % carouselItems.length;
          showCard(currentIndex);
        });

        setInterval(() => {
          if (!carouselItems.length) return;
          currentIndex = (currentIndex + 1) % carouselItems.length;
          showCard(currentIndex);
        }, 5000);
      </script>
    </div>
  </div>

</body>
</html>
