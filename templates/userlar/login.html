{% load socialaccount %}

<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish - Uzum Style</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: #e5e5e5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .phone {
        width: 360px;
        height: 720px;
        background: #000;
        border-radius: 40px;
        padding: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        position: relative;
        border: 4px solid #333;
      }
      .screen {
        width: 100%;
        height: 100%;
        background: #ffffff;
        border-radius: 28px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 40px 20px 20px;
        position: relative;
      }
      .notch {
        width: 60px;
        height: 20px;
        background: #000;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        border-bottom-left-radius: 15px;
        border-bottom-right-radius: 15px;
        z-index: 10;
      }

      .back-btn {
        font-size: 20px;
        color: #1f2026;
        text-decoration: none;
        margin-bottom: 20px;
        display: inline-block;
      }
      .header h1 {
        font-size: 24px;
        color: #1f2026;
        margin-bottom: 8px;
      }
      .header p {
        font-size: 14px;
        color: #8b8e99;
        margin-bottom: 30px;
      }

      .input-group {
        margin-bottom: 18px;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #1f2026;
        margin-bottom: 6px;
      }
      .input-group input {
        width: 100%;
        padding: 14px 16px;
        background: #f1f1f2;
        border: 1px solid transparent;
        border-radius: 12px;
        outline: none;
        font-size: 15px;
      }
      .input-group input:focus {
        border-color: #7f4df2;
        background: #fff;
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        background: #7f4df2;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 25px 0;
        color: #8b8e99;
        font-size: 14px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e2e2e5;
      }
      .divider:not(:empty)::before {
        margin-right: 15px;
      }
      .divider:not(:empty)::after {
        margin-left: 15px;
      }

      .social-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .social-btn {
        height: 52px;
        width: 100%;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: 0.2s;
      }
      .google {
        background: #fff;
        color: #1f2026;
        border: 1px solid #e2e2e5;
      }
      .github {
        background: #1f2328;
        color: #fff;
      }
      .social-icon {
        width: 20px;
        height: 20px;
      }

      .footer {
        text-align: center;
        margin-top: auto;
        padding: 20px 0;
        font-size: 14px;
        color: #8b8e99;
      }
      .footer a {
        color: #7f4df2;
        text-decoration: none;
        font-weight: 600;
      }
      .error-msg {
        color: #ea4335;
        font-size: 13px;
        margin-bottom: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header">
          <h1>Xush kelibsiz!</h1>
          <p>Profilingizga kirish uchun ma'lumotlarni kiriting</p>
        </div>

        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}

        <form method="POST">
          {% csrf_token %}
          <div class="input-group">
            <label>Foydalanuvchi nomi</label>
            <input
              type="text"
              name="username"
              placeholder="Username kiriting"
              required
            />
          </div>
          <div class="input-group">
            <label>Parol</label>
            <input
              type="password"
              name="password"
              placeholder="Parolingizni kiriting"
              required
            />
          </div>
          <button type="submit" class="submit-btn">Kirish</button>
        </form>

        <div class="divider"><span>yoki</span></div>

        <div class="social-group">
          <a href="{% provider_login_url 'google' %}" class="social-btn google">
            <svg class="social-icon" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71   1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google orqali kirish
          </a>

          <a href="{% provider_login_url 'github' %}" class="social-btn github">
            <i class="fa-brands fa-github social-icon"></i>
            GitHub orqali kirish
          </a>
        </div>

        <div class="footer">
          Profilingiz yo'qmi?
          <a href="{% url 'registratsiya' %}">Ro'yxatdan o'tish</a>
        </div>
      </div>
    </div>
  </body>
</html>
