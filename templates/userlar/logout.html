<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chiqish - Mobile UI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: #e5e5e5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* PHONE FRAME */
      .phone {
        width: 360px;
        height: 720px;
        background: #000;
        border-radius: 40px;
        padding: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        position: relative;
        border: 4px solid #333;
      }

      /* SCREEN */
      .screen {
        width: 100%;
        height: 100%;
        background: #f8f9fa;
        border-radius: 28px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .notch {
        width: 60px;
        height: 20px;
        background: #000;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        border-bottom-left-radius: 15px;
        border-bottom-right-radius: 15px;
        z-index: 110;
      }

      /* CENTER CONTENT */
      .main-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .logout-card {
        background: #fff;
        padding: 35px 20px;
        border-radius: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        width: 100%;
        text-align: center;
      }

      .icon-box {
        width: 75px;
        height: 75px;
        background: #fff0f0;
        color: #ff4d4d;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin: 0 auto 20px;
      }

      .logout-title {
        font-size: 20px;
        font-weight: 700;
        color: #1f2026;
        margin-bottom: 10px;
      }
      .logout-text {
        font-size: 15px;
        color: #8b8e99;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      /* BUTTONS */
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      .btn-logout {
        background: #ff4d4d;
        color: #fff;
        border: none;
        padding: 16px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-logout:active {
        transform: scale(0.96);
        background: #e60000;
      }

      .btn-cancel {
        background: #f1f1f2;
        color: #1f2026;
        border: none;
        padding: 16px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        display: block;
      }
      .btn-cancel:active {
        background: #e8e8e9;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="notch"></div>

      <div class="screen">
        <div class="main-content">
          <div class="logout-card">
            <div class="icon-box">
              <i class="fa-solid fa-right-from-bracket"></i>
            </div>

            <h2 class="logout-title">Tizimdan chiqish</h2>
            <p class="logout-text">
              Haqiqatan ham o'z hisobingizdan chiqmoqchimisiz?
            </p>

            <div class="btn-group">
              <form
                action="{% url 'user_logout' %}"
                method="post"
                style="display: flex; flex-direction: column; gap: 12px"
              >
                {% csrf_token %}
                <button type="submit" class="btn-logout">Ha, chiqish</button>
                <a href="{% url 'profile' %}" class="btn-cancel"
                  >Bekor qilish</a
                >
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
