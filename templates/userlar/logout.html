<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiqish - Uzum Style</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    /* ASOSIY USLUBLAR (Sizning kodingiz bilan bir xil) */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #e5e5e5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .phone {
      width: 360px; height: 720px; background: #000; border-radius: 40px;
      padding: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative; border: 4px solid #333;
    }

    .screen {
      width: 100%; height: 100%; background: #ffffff; border-radius: 28px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }

    .notch {
      width: 60px; height: 20px; background: #000; position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 110;
    }

    /* LOGOUT CONTENT */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: #f8f9fa;
    }

    .logout-card {
      background: #fff;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: #fff0f0;
      color: #ff4d4d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }

    .logout-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2026;
      margin-bottom: 10px;
    }

    .logout-text {
      font-size: 15px;
      color: #8b8e99;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* TUGMALAR */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-logout {
      background: #ff4d4d;
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn-logout:active { transform: scale(0.98); background: #e60000; }

    .btn-cancel {
      background: #f1f1f2;
      color: #1f2026;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    /* BOTTOM NAV (Sizning kodingiz bilan bir xil) */
    .bottom-nav {
      height: 75px; background: #fff; border-top: 1px solid #eee;
      display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px;
    }

    .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; color: #8e8e93; flex: 1; }
    .nav-item i { font-size: 22px; margin-bottom: 4px; }
    .nav-item span { font-size: 10px; }
    .nav-item.active { color: #6366f1; }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    
    <div class="screen">
      
      <div class="main-content">
        <div class="logout-card">
          <div class="icon-box">
            <i class="fa-solid fa-right-from-bracket"></i>
          </div>
          
          <h2 class="logout-title">Tizimdan chiqish</h2>
          <p class="logout-text">Haqiqatan ham o'z hisobingizdan chiqmoqchimisiz?</p>
          
          <div class="btn-group">
            <form action="{% url 'user_logout' %}" method="post" style="display: flex; flex-direction: column; gap: 12px;">
              {% csrf_token %}
              <button type="submit" class="btn-logout">Ha, chiqish</button>
              <a href="{% url 'profile' %}" class="btn-cancel">Bekor qilish</a>
            </form>
          </div>
        </div>
      </div>

      <nav class="bottom-nav">
        <a href="{% url 'home_page' %}" class="nav-item"><i class="fa-solid fa-house"></i><span>Asosiy</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Katalog</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Savat</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-heart"></i><span>Istaklar</span></a>
        <a href="{% url 'profile' %}" class="nav-item active"><i class="fa-regular fa-user"></i><span>Profil</span></a>
      </nav>

    </div>
  </div>

</body>
</html>
