{% extends 'base.html' %}

{% block main %}

{% load humanize %}



<div class="main-content">

  <div class="slider-container">

    <div class="slider-wrapper" id="sliderWrapper">

      <div class="slide">

        <div class="slide-img" style="background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=500');">

          <div class="slide-content"><h2>TERRA PRO</h2></div>

        </div>

      </div>

    </div>

    <div class="dots">

      <div class="dot active"></div>

      <div class="dot"></div>

      <div class="dot"></div>

    </div>

  </div>



  <h3 style="padding: 0 15px; margin-bottom: 12px; font-size: 18px">Siz uchun tavsiyalar</h3>



  <div class="product-grid">

    {% for i in page_obj %}

    <div class="product-card" style="position: relative;">

     

      <form action="{% url 'istak_like_bos' %}" method="POST" style="position:absolute; top:10px; right:10px; z-index:2;">

        {% csrf_token %}

        <input type="hidden" name="product_id" value="{{ i.id }}">

       

        <button type="submit" style="background:none; border:none; padding:0;">

          <i class="fa-heart wish-icon

            {% if i.id in liked_product_ids %}

              fa-solid active

            {% else %}

              fa-regular

            {% endif %}

          "></i>

        </button>

      </form>



      <!-- PRODUCT -->

      <a href="{% url 'product_details' i.slug %}" style="text-decoration: none; color: inherit; display: block;">

        {% if i.images.all %}

          <img class="product-img" src="{{ i.images.all.0.image.url }}" alt="{{ i.name }}" />

        {% endif %}

        <div class="product-info">

          <p class="product-title">{{ i.name |capfirst }}</p>

          <div class="price-container">

            <span class="price-now">{{ i.price|intcomma }} so'm</span>

          </div>

        </div>

      </a>



      <!-- CART -->

      <div style="padding: 0 8px 8px 8px;">

        <form action="{% url 'shoping_cart_create' %}" method="POST">

          {% csrf_token %}

          <input type="hidden" name="uzumproduct" value="{{ i.id }}">

          <input type="hidden" name="user" value="{{ request.user.id }}">

          <button type="submit" class="add-cart-btn">

            <i class="fa-solid fa-cart-plus"></i>

            <span>Savatga</span>

          </button>

        </form>

      </div>



    </div>

    {% endfor %}

  </div>

</div>



<style>

  .wish-icon {

    font-size: 20px;

    cursor: pointer;

    transition: transform 0.2s ease, color 0.2s ease;

    color: #555;

    position: absolute;

    top: 10px;

    right: 10px;

  }



  .wish-icon.active {

    color: #ff4d4d !important;

    transform: scale(1.2);

  }



  .add-cart-btn {

    width: 100%;

    height: 40px;

    background: transparent;

    border: 1px solid #7f4df2;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    color: #7f4df2;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: all 0.2s ease;

  }



  .add-cart-btn:active {

    background: #7f4df2;

    color: #fff;

    transform: scale(0.96);

  }

</style>



{% endblock main %}
